name: build

# Derive the MEOS catalog and the all-families libmeos from a single
# MobilityDB commit via the shared provision-meos action (the same derivation
# JMEOS / Spark / PyMEOS-CFFI consume), regenerate the flat FFI functions
# package from that catalog, and prove the committed generated code is in sync
# with it. No MEOS header is parsed in this repository: the functions package
# is a projection of the catalog, and cgo only compiles it against the
# installed libmeos. The catalog itself is never committed — it is derived
# here from MobilityDB.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Provision catalog + build GoMEOS (Linux, all families)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision MEOS (catalog + all-families libmeos)
        id: provision
        # Derive the MEOS catalog (meos-idl.json) and the libmeos build from upstream
        # MobilityDB master through the shared provision-meos action. Tracking master
        # (not a pinned commit) keeps the source, the catalog and the native library the
        # binding is generated against all moving together.
        uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
        with:
          mobilitydb-ref: master
          build-libmeos: "true"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # The committed functions package is what a `go get` consumer compiles, and
      # every step below overwrites it, so its own compilability is decided HERE
      # or nowhere. Drift against the freshly derived catalog is expected and
      # constant, because MobilityDB master moves independently of this repo --
      # but a snapshot that no longer BUILDS is a consumer breakage, and it is
      # invisible to a job that regenerates first. A retired spelling (mult_*,
      # RTreeSearchOp) reaches consumers exactly this way.
      - name: Build the COMMITTED functions package (what a `go get` consumer compiles)
        env:
          CGO_CFLAGS: -I/usr/local/include -I/usr/include/h3
          CGO_LDFLAGS: -L/usr/local/lib -lmeos
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          if ! go build ./functions ./types; then
            echo "::error::the committed functions/ or types/ snapshot does not build against this libmeos."
            echo "Refresh them: python3 tools/objectgen.py against a freshly derived meos-idl.json, then commit both."
            exit 1
          fi

      - name: Stage the derived catalog for the generator
        run: cp "${{ steps.provision.outputs.catalog-path }}" tools/meos-idl.json

      # objectgen RUNS codegen and then projects the object model, so one command
      # regenerates both packages and neither can be refreshed without the other.
      # types/ calls the wrappers codegen emits, so a functions/ refreshed alone
      # leaves the object layer calling a surface that has moved.
      - name: Regenerate the functions and types packages from the catalog
        run: python3 tools/objectgen.py

      - name: Report drift between the committed and freshly derived functions package
        run: |
          # Informational only, and deliberately so: MobilityDB master moves
          # independently of this repo, so a difference here is ordinary and a
          # contributor cannot act on it. What a stale snapshot COSTS is caught
          # by the committed-snapshot build above, which fails.
          # The committed functions/ is a convenience snapshot for `go get`
          # consumers; refresh it by running 'python3 tools/codegen.py' against a
          # freshly derived meos-idl.json and committing the result.
          if ! git diff --quiet -- functions/ types/; then
            echo "::notice::the generated packages differ from the freshly derived catalog (snapshot lags MobilityDB master):"
            git diff --stat -- functions/ types/
          else
            echo "functions/ and types/ snapshots are in sync with the derived catalog."
          fi

      - name: Build the generated functions and types packages against the all-families libmeos
        env:
          CGO_CFLAGS: -I/usr/local/include -I/usr/include/h3
          CGO_LDFLAGS: -L/usr/local/lib -lmeos
          LD_LIBRARY_PATH: /usr/local/lib
        run: go build ./functions ./types

      - name: Run the portable-parity gate
        env:
          CGO_ENABLED: "0"
        run: go test ./tools/parity/

      # The root gomeos package carries the binding's only behavioural tests:
      # Example functions whose `// Output:` block is the assertion. They need
      # libmeos, which this job already installs, and until now no job collected
      # them -- so their expectations were never compared against MEOS at all.
      # TZ is stated rather than inherited: the expectations print timestamptz
      # values, so the zone is an input to the assertion.
      - name: Run the gomeos package tests against the all-families libmeos
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          LD_LIBRARY_PATH: /usr/local/lib
          TZ: UTC
        run: go test -v . 2>&1 | tee test.log

      # Refuse the two ways this suite could stop covering the binding while the
      # job still reports success: a test that skips, and a suite that shrank.
      - name: Refuse a skipped test, and hold the test count
        uses: MobilityDB/MEOS-API/.github/actions/check-test-outcome@master
        with:
          log: test.log
          min-tests: "121"
